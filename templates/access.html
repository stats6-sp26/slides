<script>
(function() {
  const fixAccessibility = () => {
    // 1. FIX HAMBURGER MENU
    // The menu plugin usually adds this to the bottom-left
    const menuBtn = document.querySelector('.slide-menu-button a');
    if (menuBtn && !menuBtn.hasAttribute('aria-label')) {
      menuBtn.setAttribute('aria-label', 'Open navigation menu');
      menuBtn.setAttribute('role', 'button');
    }

    // 2. FIX R CODE EMPTY LINKS
    const codeLinks = document.querySelectorAll('pre.numberSource code > span > a[href=""]');
    codeLinks.forEach(link => {
      link.setAttribute('aria-hidden', 'true');
      link.setAttribute('tabindex', '-1');
      link.removeAttribute('href');
    });

    // 3. FIX GLOBAL LOGO
    const logo = document.querySelector('.reveal .slide-logo');
    if (logo && !logo.hasAttribute('alt')) {
      logo.setAttribute('alt', 'Course logo');
      logo.setAttribute('role', 'img');
    }
  };

  // Create an observer to catch the menu button when it's added to the DOM
  const observer = new MutationObserver((mutations) => {
    fixAccessibility();
  });

  // Start observing the whole body for changes
  observer.observe(document.body, { childList: true, subtree: true });

  // Also run on load and slide change just to be safe
  window.addEventListener('load', fixAccessibility);
  if (window.Reveal) {
    Reveal.on('ready', fixAccessibility);
    Reveal.on('slidechanged', fixAccessibility);
  }
})();
</script>
